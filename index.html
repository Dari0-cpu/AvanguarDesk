<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AvanguarDesk</title>

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="stylesheet" href="basegraf.css">

    <link rel="manifest" href="manifest.json">
</head>
<body>
<div class="topbar">
    <header>
        <button id="btnSearch" class="icon-btn" title="Cerca">🔍</button>
        <h1>AvanguarDesk</h1>
        <div class="header-actions">
            <button id="btnSync" class="icon-btn cloud-btn" title="Sincronizza">☁️</button>
            <button id="btnTheme" class="icon-btn" title="Tema dell'app">🎨</button>
        </div>
    </header>

    <!-- Barra di Ricerca -->
    <div id="searchBar" class="search-bar">
        <input type="search" id="searchInput" placeholder="Cerca nome, location, telefono, problema..." autocomplete="off">
        <button id="btnSearchClear" class="search-clear" title="Pulisci">×</button>
    </div>
</div>

<main class="container">
    <!-- Clienti Attivi -->
    <section>
        <h2>In Lavorazione</h2>
        <div id="activeClients" class="cards-grid"></div>
    </section>

    <!-- Clienti Completati -->
    <section class="done-section">
        <h2>Completati</h2>
        <div id="doneClients" class="done-list"></div>
    </section>
</main>

<!-- Pulsante Aggiungi Hover -->
<button class="fab" id="fab">+</button>

<!-- Modal Aggiunta Cliente -->
<div id="addModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModals()">×</button>
        <h2 class="modal-title" id="formModalTitle">Nuovo Cliente</h2>
        <form id="addForm" autocomplete="off">
            <div class="form-group"><input type="text" id="i_nome" placeholder="Nome" required></div>
            <div class="form-group"><input type="text" id="i_cognome" placeholder="Cognome (opzionale)"></div>
            <div class="form-group">
                <input type="text" id="i_location" placeholder="Location (cerca indirizzo...)" autocomplete="off">
                <ul id="locSuggestions" class="suggestions"></ul>
            </div>
            <div class="form-group"><input type="tel" id="i_telefono" placeholder="Telefono (opzionale)"></div>
            <div class="form-group"><input type="email" id="i_mail" placeholder="Mail (opzionale)"></div>
            <div class="form-group textarea-group">
                <textarea id="i_descrizione" placeholder="Descrizione del problema..."></textarea>
                <button type="button" id="btnMic" class="mic-btn" title="Dettatura vocale">🎤</button>
            </div>
            <p class="mic-hint" id="micHint"></p>
            <button type="submit" class="btn-submit">Salva Cliente</button>
        </form>
    </div>
</div>

<!-- Modal Dettaglio Cliente -->
<div id="detailModal" class="modal-overlay">
    <!-- Aggiunto padding-bottom per fare spazio al bottone -->
    <div class="modal-content" style="padding-bottom: 60px;">
        <button class="modal-close" onclick="closeModals()">×</button>

        <!-- QUI DEVE ESSERCI SOLO QUESTO TITOLO -->
        <h2 class="modal-title" id="d_nome">Nome</h2>

        <div class="detail-row"><span class="detail-label">Location:</span> <p class="detail-value" id="d_location"></p></div>
        <div class="detail-row"><span class="detail-label">Telefono:</span> <p class="detail-value" id="d_telefono"></p></div>
        <div class="detail-row"><span class="detail-label">Mail:</span> <p class="detail-value" id="d_mail"></p></div>
        <div class="detail-row"><span class="detail-label">Problema:</span> <p class="detail-value" id="d_descrizione"></p></div>

        <!-- NUOVO CONTENITORE PULSANTI -->
        <div style="position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between;">
            <button id="btnEditClient" class="btn-submit" style="width: auto; padding: 8px 15px; font-size: 0.95rem; margin-top: 0;">✏️ Modifica</button>
            <button id="btnDeleteActive" class="delete-active-btn" title="Elimina definitivamente">🗑️ Elimina</button>
        </div>
    </div>
</div>

<!-- Modal Temi -->
<div id="themeModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModals()">×</button>
        <h2 class="modal-title">Tema dell'app</h2>
        <div id="themeGrid" class="theme-grid"></div>
    </div>
</div>

<!-- Modal Supabase Sync -->
<div id="supaModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModals()">×</button>
        <h2 class="modal-title">Cloud Sync</h2>
        <p style="font-size: 0.9rem; margin-bottom:15px; color: var(--muted);">Usa un codice univoco per salvare o recuperare i tuoi clienti.</p>
        <form id="supaForm" autocomplete="off">
            <div class="form-group">
                <input type="text" id="s_codice" placeholder="Es: dario_lavori_26" required>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="button" id="btnPull" class="btn-submit" style="background: var(--muted-soft); color: #111;">⬇️ Recupera</button>
                <button type="submit" id="btnPush" class="btn-submit">⬆️ Salva in Cloud</button>
            </div>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
